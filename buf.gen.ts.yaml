# TypeScript-only template, invoked alongside the main buf.gen.yaml by
# `just buf-generate`. Kept separate so --include-imports (needed for the
# google/api descriptors our protos reference) does not leak google/api
# generation into the Go and Rust outputs.
version: v1
plugins:
  - plugin: es
    out: autogenerated/ts
    opt:
      - target=ts
