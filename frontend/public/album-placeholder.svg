<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Offline Frequencies — cassette artwork</title>
  <desc id="desc">Pixel-art cream and terracotta cassette on a deep green LCD background, used as the offline fallback album cover.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="4" height="4" fill="#8fe3c0" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#0d1c15"/>
  <rect width="512" height="512" fill="url(#dots)"/>

  <!-- Pixel sun -->
  <rect x="392" y="64" width="96" height="96" fill="#c96a47"/>
  <rect x="408" y="48" width="64" height="128" fill="#c96a47"/>
  <rect x="376" y="80" width="128" height="64" fill="#c96a47"/>
  <rect x="408" y="80" width="64" height="64" fill="#ffd36e"/>
  <rect x="424" y="64" width="32" height="96" fill="#ffd36e"/>
  <rect x="392" y="96" width="96" height="32" fill="#ffd36e"/>

  <!-- Cassette -->
  <rect x="84" y="176" width="360" height="236" fill="#9a4a2e"/>
  <rect x="72" y="164" width="360" height="236" fill="#f2e7cc"/>
  <rect x="72" y="164" width="360" height="44" fill="#c96a47"/>

  <!-- Case screws -->
  <rect x="92" y="184" width="16" height="16" fill="#21372e"/>
  <rect x="396" y="184" width="16" height="16" fill="#21372e"/>
  <rect x="92" y="364" width="16" height="16" fill="#21372e"/>
  <rect x="396" y="364" width="16" height="16" fill="#21372e"/>

  <!-- Tape window -->
  <rect x="124" y="236" width="256" height="96" fill="#0d1c15"/>
  <rect x="127" y="239" width="250" height="90" fill="none" stroke="#8fe3c0" stroke-width="6"/>

  <!-- Reels -->
  <circle cx="196" cy="284" r="38" fill="#c96a47"/>
  <circle cx="196" cy="284" r="26" fill="#f2e7cc"/>
  <circle cx="196" cy="284" r="10" fill="#21372e"/>
  <rect x="188" y="228" width="16" height="112" fill="#0d1c15" opacity=".55"/>
  <rect x="140" y="276" width="112" height="16" fill="#0d1c15" opacity=".55"/>

  <circle cx="308" cy="284" r="38" fill="#c96a47"/>
  <circle cx="308" cy="284" r="26" fill="#f2e7cc"/>
  <circle cx="308" cy="284" r="10" fill="#21372e"/>
  <rect x="300" y="228" width="16" height="112" fill="#0d1c15" opacity=".55"/>
  <rect x="252" y="276" width="112" height="16" fill="#0d1c15" opacity=".55"/>

  <!-- Label -->
  <rect x="124" y="348" width="256" height="48" fill="#8fe3c0"/>
  <rect x="126" y="350" width="252" height="44" fill="none" stroke="#21372e" stroke-width="4"/>
  <text x="252" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.5" fill="#0d1c15">OFFLINE FREQUENCIES</text>
  <text x="252" y="388" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#1d3a2e">SIDE A · LOCALHOST RADIO</text>
</svg>
